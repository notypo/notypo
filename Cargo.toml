[package]
name = "notypo"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A fast Rust port of thefuck: corrects errors in previous console commands"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/notypo/notypo"
exclude = ["/benches/", "/benchmarks/"]
keywords = ["cli", "shell", "thefuck", "typo"]
categories = ["command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "notypo"
path = "src/main.rs"

[[bench]]
name = "correction"
harness = false

[[bench]]
name = "engine"
harness = false

[dependencies]
libc = "0.2.190"
regex = "1.13.1"
serde_json = "1"
vt100 = "0.16.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
