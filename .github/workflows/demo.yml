name: Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Record CLI demo
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install recording tools
        run: brew install vhs ffmpeg webp
      - name: Record and encode
        run: ./scripts/record-demo.sh
      - name: Upload demo assets
        uses: actions/upload-artifact@v7
        with:
          name: notypo-demo
          path: |
            demo/notypo-demo.avif
            demo/notypo-demo.webp
            demo/notypo-demo.gif
          if-no-files-found: error
